<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NASA Space Explorer</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <div class="container">
    <header class="site-header">
      <img src="img/nasa-worm-logo.png" alt="NASA Logo" class="logo" />
      <h1>Space Explorer</h1>
    </header>

    <div class="filters">
      <input type="date" id="startDate" />
      <input type="date" id="endDate" />
      <button id="imgButton">Get Space Images</button>
    </div>

    <section id="spaceFact" class="space-fact" aria-labelledby="spaceFactHeading">
      <h2 id="spaceFactHeading">Random space fact</h2>
      <p id="spaceFactContent" role="status">Finding a space fact...</p>
    </section>

    <div id="gallery" class="gallery">
      <div class="placeholder">
        <div class="placeholder-icon">🔭</div>
        <p>Select a date range and click "Get Space Images" to explore the cosmos!</p>
      </div>
    </div>
  </div>

  <dialog id="imageModal" class="image-modal" aria-labelledby="modalTitle">
    <button id="closeModal" class="modal-close" type="button" aria-label="Close details">
      &times;
    </button>
    <img id="modalImage" class="modal-image" alt="" />
    <a id="modalVideoLink" class="modal-video-link" target="_blank" rel="noopener noreferrer" hidden>
      Watch this NASA video
    </a>
    <h2 id="modalTitle"></h2>
    <p id="modalDate"></p>
    <p id="modalExplanation"></p>
    <p id="modalCopyright"></p>
  </dialog>

  <script src="js/dateRange.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
